name: E2E Test Suite

# Runs the osc-character-sheet Playwright E2E specs headlessly against real Foundry
# servers (OSE system + osc-character-sheet module), one leg per Foundry × OSE pair in
# the matrix below. Needs repo secrets FOUNDRY_USERNAME / FOUNDRY_PASSWORD — see
# tools/e2e/README.md.
#
# `e2e` is a REQUIRED check (main ruleset), so it must always report a status — a
# `paths:` trigger filter would leave the check pending forever and block the PR.
# Instead the plan job always starts and decides whether anything E2E-relevant changed,
# the legs run only if it did, and the final `e2e` job rolls them up. No relevant
# change ⇒ `e2e` goes green in seconds without spinning up Foundry. Detection uses
# gh/git only, no third-party action.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# One license = one server: serialize, drop superseded runs. Legs share one run, so this
# never cancels a leg for another; max-parallel: 1 keeps them off the license together.
# Keyed by event name as well as PR, or the pull_request_target run cancels the
# pull_request run on a same-repo PR and then skips itself, leaving the required check with no green status.
concurrency:
  group: e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The test matrix, one entry per line. Foundry entries are felddy image tags (majors).
# OSE entries are a release tag or latest-release / latest-prerelease, resolved from
# GitHub at run time; latest-prerelease is the newest release of any kind.
env:
  FOUNDRY_VERSIONS: |
    13
    14
  OSE_VERSIONS: |
    latest-release
    latest-prerelease

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      # Decide whether anything the suite depends on changed. Runs before checkout
      # (no untrusted code, no secrets) via the GitHub API — an irrelevant PR never
      # even checks out the PR head. workflow_dispatch always runs.
      - name: Detect E2E-relevant changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — running."; echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" \
              -q '.[].filename')
          else
            files=$(gh api \
              "repos/$GITHUB_REPOSITORY/compare/${{ github.event.before }}...${{ github.sha }}" \
              -q '.files[].filename' 2>/dev/null || echo "__ALL__")
          fi
          echo "Changed files:"; echo "$files"
          # __ALL__ (e.g. branch-creation push with no diff base) ⇒ run to be safe.
          if [ "$files" = "__ALL__" ] || echo "$files" | grep -qE \
            '^(src/|templates/|lang/|tools/e2e/|module\.json|package\.json|pnpm-lock\.yaml|\.github/workflows/e2e\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No E2E-relevant changes — skipping the suite (check reports green)."
          fi

      - name: Resolve the Foundry × OSE matrix
        id: matrix
        if: steps.filter.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases=$(gh api --paginate repos/NecroticGnome/ose-foundry-core/releases \
            -q '.[] | select(.draft | not) | [.published_at, .tag_name, .prerelease] | @tsv' | sort -r)
          latest_release=$(echo "$releases" | awk -F'\t' '$3 == "false" { print $2; exit }')
          latest_any=$(echo "$releases" | head -1 | cut -f2)
          resolve() {
            case "$1" in
              latest-release) echo "$latest_release" ;;
              latest-prerelease) echo "$latest_any" ;;
              *) echo "$1" ;;
            esac
          }
          include=$(for f in $FOUNDRY_VERSIONS; do for o in $OSE_VERSIONS; do
            jq -nc --arg foundry "$f" --arg ose "$(resolve "$o")" '{foundry: $foundry, ose: $ose}'
          done; done | jq -sc 'unique_by([.foundry, .ose])')
          echo "Matrix: $include"
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  leg:
    needs: plan
    if: needs.plan.outputs.relevant == 'true'
    name: e2e (v${{ matrix.foundry }}, OSE ${{ matrix.ose }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      FOUNDRY_VERSION: ${{ matrix.foundry }}
      OSE_VERSION: ${{ matrix.ose }}
      FOUNDRY_PORT: 30000
      WORLD_ID: e2e
      DATA_DIR: ${{ github.workspace }}/.foundry-ci
      FOUNDRY_URL: http://localhost:30000

    steps:
      - name: Fail early if Foundry credentials are missing
        env:
          FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_USERNAME }}
          FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_PASSWORD }}
        run: |
          if [ -z "$FOUNDRY_USERNAME" ] || [ -z "$FOUNDRY_PASSWORD" ]; then
            echo "::error::FOUNDRY_USERNAME and FOUNDRY_PASSWORD secrets are required." \
                 "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Pull Foundry image and resolve version
        run: |
          docker pull "felddy/foundryvtt:${FOUNDRY_VERSION}"
          # felddy labels the image with the exact build it installs — stabilizes the cache key.
          RESOLVED=$(docker image inspect "felddy/foundryvtt:${FOUNDRY_VERSION}" \
            --format '{{ index .Config.Labels "com.foundryvtt.version" }}' || true)
          [ -z "$RESOLVED" ] && RESOLVED="$FOUNDRY_VERSION"
          echo "FOUNDRY_RESOLVED=$RESOLVED" >> "$GITHUB_ENV"
          echo "Resolved Foundry build: $RESOLVED"

      # Caching the Foundry zip (felddy's CONTAINER_CACHE) is the biggest win: warm boot ~5-10s.
      - name: Cache Foundry distribution
        uses: actions/cache@v6
        with:
          path: ${{ env.DATA_DIR }}/container_cache
          key: foundry-dist-${{ env.FOUNDRY_RESOLVED }}
          restore-keys: |
            foundry-dist-${{ env.FOUNDRY_VERSION }}.

      - name: Build the osc-character-sheet module
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Assemble Foundry data directory (OSE + osc-character-sheet + world)
        run: |
          mkdir -p "${DATA_DIR}"
          tools/e2e/setup-data-dir.sh "${DATA_DIR}" "${GITHUB_WORKSPACE}"
          # felddy runs as uid:gid 1000:1000; without this its /data write test fails and it
          # exits immediately (felddy/foundryvtt-docker#1197).
          sudo chown -R 1000:1000 "${DATA_DIR}"

      # Start the container first so it boots while the runner deps install below.
      - name: Start Foundry container
        env:
          FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_USERNAME }}
          FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_PASSWORD }}
        run: |
          docker run -d --name foundry \
            -p "${FOUNDRY_PORT}:30000" \
            -v "${DATA_DIR}:/data" \
            -e FOUNDRY_USERNAME="${FOUNDRY_USERNAME}" \
            -e FOUNDRY_PASSWORD="${FOUNDRY_PASSWORD}" \
            -e CONTAINER_CACHE=/data/container_cache \
            -e FOUNDRY_MINIFY_STATIC_FILES=true \
            -e FOUNDRY_TELEMETRY=false \
            -e "FOUNDRY_WORLD=${WORLD_ID}" \
            "felddy/foundryvtt:${FOUNDRY_VERSION}"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/e2e/package.json') }}

      - name: Install E2E runner dependencies
        working-directory: tools/e2e
        run: |
          npm install --no-package-lock --no-audit --no-fund
          # The hosted runner's packages.microsoft.com apt repo intermittently
          # ships a malformed Release file ("Clearsigned file isn't valid, got
          # 'NOSPLIT'"), which fails `--with-deps`' apt-get update. Chromium's
          # deps come from the standard Ubuntu archive, so drop the MS sources.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list || true
          npx playwright install chromium --with-deps

      - name: Wait for Foundry to be healthy
        run: |
          echo "Waiting for the Foundry container to become healthy..."
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{ .State.Health.Status }}' foundry 2>/dev/null || echo missing)
            state=$(docker inspect -f '{{ .State.Status }}' foundry 2>/dev/null || echo missing)
            echo "  [$((i*5))s] health=$status state=$state"
            if [ "$status" = "healthy" ]; then echo "Container healthy."; exit 0; fi
            if [ "$state" = "exited" ]; then
              echo "::error::Foundry container exited before becoming healthy."
              docker logs foundry || true
              exit 1
            fi
            sleep 5
          done
          echo "::error::Foundry container did not become healthy in time."
          docker logs foundry || true
          exit 1

      # First-boot activation (see activate-world.mjs): accept the EULA (generates the
      # host-bound license signature, which can't be pre-committed), then restart so felddy's
      # FOUNDRY_WORLD auto-launches the world server-side. Clear the stale lock felddy leaves behind.
      - name: Accept EULA
        working-directory: tools/e2e
        run: |
          node activate-world.mjs --phase eula \
            --url "http://localhost:${FOUNDRY_PORT}" \
            --wait 240

      - name: Restart Foundry to auto-launch the world
        run: |
          docker stop -t 30 foundry
          sudo rm -rf "${DATA_DIR}/Config/options.json.lock"
          docker start foundry
          echo "Waiting for the restarted container to become healthy..."
          for i in $(seq 1 36); do
            status=$(docker inspect -f '{{ .State.Health.Status }}' foundry 2>/dev/null || echo missing)
            state=$(docker inspect -f '{{ .State.Status }}' foundry 2>/dev/null || echo missing)
            echo "  [$((i*5))s] health=$status state=$state"
            if [ "$status" = "healthy" ]; then echo "Container healthy."; exit 0; fi
            if [ "$state" = "exited" ]; then
              echo "::error::Foundry container exited during restart."
              docker logs --since 5m foundry || true
              exit 1
            fi
            sleep 5
          done
          echo "::error::Foundry container did not become healthy after restart."
          docker logs --since 5m foundry || true
          exit 1

      - name: Wait for world activation
        working-directory: tools/e2e
        run: |
          node activate-world.mjs --phase await \
            --url "http://localhost:${FOUNDRY_PORT}" \
            --wait 240

      - name: Run Playwright E2E suite
        working-directory: tools/e2e
        run: npx playwright test --forbid-only

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-v${{ matrix.foundry }}-ose-${{ matrix.ose }}
          path: tools/e2e/playwright-report
          if-no-files-found: warn

      - name: Dump Foundry logs on failure
        if: failure()
        run: docker logs foundry || true

  e2e:
    needs: [plan, leg]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Roll up the matrix legs
        run: |
          echo "plan=${{ needs.plan.result }} legs=${{ needs.leg.result }}"
          [ "${{ needs.plan.result }}" = "success" ] || exit 1
          case "${{ needs.leg.result }}" in success|skipped) ;; *) exit 1 ;; esac
